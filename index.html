.entry .edish{width:64px;height:64px;border-radius:50%;background:var(--dish);
  box-shadow:0 0 0 1px var(--dish-rim) inset;display:grid;place-items:center}

  var T = STR[LANG];

  /* ---------------- 그림: 굵은 선 스티커 (시안 A) ---------------- */
  var INK="#3A2411", K=3.4, BR="#B5793C", GD="#E8B733",
      ST="#96897A", WA="#BE8C55", GH="#EADCC0";

  function el(l){ return '<ellipse cx="'+l[0]+'" cy="'+l[1]+'" rx="'+l[2]+'" ry="'+l[3]+'"/>'; }
  function lobes(a){ return a.map(el).join(''); }
  function noodle(d,w){ return '<path d="'+d+'" fill="none" stroke-width="'+w+'" stroke-linecap="round"/>'; }
  function tip(cx,y,w,h){
    return '<path d="M'+cx+' '+(y-h)+' C '+(cx+w*.8)+' '+(y-h*.45)+' '+(cx+w)+' '+(y-h*.15)+' '+(cx+w)+' '+y+
           ' L '+(cx-w)+' '+y+' C '+(cx-w)+' '+(y-h*.15)+' '+(cx-w*.8)+' '+(y-h*.45)+' '+cx+' '+(y-h)+' Z"/>';

  function ol(shapes, fill){

    return '<g fill="'+INK+'" stroke="'+INK+'" stroke-width="'+(K*2)+
           '" stroke-linejoin="round" stroke-linecap="round">'+fat+'</g>'+

  }
  function face(x,y,o){
    o=o||{}; var s=o.s||1, c=o.c||INK, ex=7*s, w=2.5*s, out="";

    function dot(px){ return '<ellipse cx="'+px+'" cy="'+y+'" rx="'+(2.5*s)+'" ry="'+(3.1*s)+'" fill="'+c+'"/>'; }

    var d = '<path d="M50 48 C59 71 83 71 93 50 C103 29 90 12 66 17 '+
      'M50 48 C41 71 17 71 7 50 C-3 29 10 12 34 17" '+
      'fill="none" stroke="var(--ink)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>';
    var wrap = withId ? '<g id="buttBody">' : '<g>';
    var orb = withId ? '<circle id="popOrb" cx="50" cy="48" r="9" fill="'+BR+'" stroke="var(--ink)" stroke-width="2"/>' : '';
    return svg(shadow + wrap + d + '</g>' + orb);

  function fortuneOf(item){
    var i = idx(item.id), b = dayNum() + i*17, t = TIER[item.tier];
    function mod(x, n){ return ((x % n) + n) % n; }
    function jit(base, off){ return Math.max(1, Math.min(5, base + mod(b + off, 3) - 1)); }
    return {
      head:  item.fort[LANG][mod(b, item.fort[LANG].length)],
      adv:   item.adv[LANG][mod(b*3 + 5, item.adv[LANG].length)],
      love:  t.love[LANG][mod(b + 1, t.love[LANG].length)],
      money: t.money[LANG][mod(b*2 + 3, t.money[LANG].length)],
      health:t.health[LANG][mod(b + 5, t.health[LANG].length)],
      study: t.study[LANG][mod(b*3 + 2, t.study[LANG].length)],
      s: { love: jit(item.s.love,0), money: jit(item.s.money,1),
           health: jit(item.s.health,2), study: jit(item.s.study,3) },
      color: COLORS[mod(b*5 + 2, COLORS.length)],
      num:   mod(b*7 + 11, 45) + 1,
      time:  TIMES[LANG][mod(b + 3, TIMES[LANG].length)]
    };
  }

    if(!total){ el.hidden = true; return; }
    var best = null;
    for(i=0;i<N;i++){ if((STATE.c[DDONG[i].id]||0)===max && !best) best = DDONG[i]; }
    var bars = DDONG.map(function(it){
      var n = STATE.c[it.id]||0, hpct = max ? Math.round(n/max*100) : 0;
      var cls = "tbar" + (it.id===myId ? " mine" : (it.id===best.id ? " best" : ""));
      return '<div class="'+cls+'" title="'+esc(it.name[LANG])+' — '+n+'">'+
             (n ? '<em>'+n+'</em>' : '')+'<i style="height:'+Math.max(hpct,3)+'%"></i></div>';
    }).join("");
    el.innerHTML = '<h3>'+T.tallyTitle+'</h3>'+
      '<p class="cnt">'+T.tallyCount(total)+'</p>'+
      '<div class="tbars">'+bars+'</div>'+
      '<div class="tfoot"><span>'+T.rankLabel(1)+' '+esc(BEST)+'</span><span>'+T.rankLabel(N)+' '+esc(WORST)+'</span></div>'+
      '<p class="tnote">'+T.tallyTop('<b>'+esc(best.name[LANG])+'</b>', max)+
      (myId ? T.tallyMine : '')+'</p>';
    el.hidden = false;
  }

  /* ---------------- result ---------------- */
  function row(label, f, key){
    return '<div class="sf"><span class="lb">'+label+'</span>'+
      '<span class="dots">'+dots(f.s[key])+'</span>'+
      '<span class="tx">'+esc(f[key])+'</span></div>';
  }
  function renderResult(item, fresh){
    var rank = idx(item.id)+1, isGold = rank===1, f = fortuneOf(item);
    var dish = $("dish");
    dish.className = "dish" + (fresh ? " pop reveal" : "");
    dish.innerHTML = svg(item.art);

    $("result").innerHTML =
      '<div class="gradeRow"><span class="grade'+(isGold?" top":"")+'">'+T.grade+' '+item.grade+'</span>'+
      '<span class="rankno">'+T.rankLabel(rank)+'</span></div>'+
      '<h2 class="name'+(isGold?" gold":"")+'">'+esc(item.name[LANG])+'</h2>'+
      '<p class="fortune">'+esc(f.head)+'</p>'+
      '<div class="sfs">'+row(T.love,f,"love")+row(T.money,f,"money")+
        row(T.health,f,"health")+row(T.study,f,"study")+'</div>'+
      '<div class="lucky">'+
        '<div><div class="k">'+T.luckyColor+'</div><div class="v">'+esc(f.color.n[LANG])+'</div></div>'+
        '<div><div class="k">'+T.luckyNumber+'</div><div class="v">'+f.num+'</div></div>'+
        '<div><div class="k">'+T.luckyTime+'</div><div class="v">'+esc(f.time)+'</div></div>'+
      '</div>'+
      '<div class="advice"><b>'+T.adviceTitle+'</b>'+esc(f.adv)+'</div>'+
      '<div class="note"><b>'+T.aboutTitle+'</b>'+esc(item.desc[LANG])+'</div>'+
      (TEST ? '<div class="testbar"><span class="testchip">'+T.testChip+'</span>'+
          '<button class="again" id="again">'+T.nextDayBtn+'</button></div>' : '');
    $("result").hidden = false;
    if(fresh) $("result").classList.add("pop");
    $("lever").disabled = false;
    $("lever").textContent = T.leverAgain;
    $("hint").hidden = true;
    if(TEST) $("again").addEventListener("click", nextDay);
  }


  function renderHistory(){
    var h = load(HKEY) || [];
    if(!h.length){ $("history").hidden = true; return; }
    $("history").hidden = false;
    $("hlist").innerHTML = h.slice(0,7).map(function(r){
      var it = byId(r.id); if(!it) return "";
      var md = r.date.slice(5).replace("-",".");
      return '<div class="hitem" title="'+md+' '+esc(it.name[LANG])+'"><div class="hdish">'+svg(it.art)+
             '</div><span>'+md+'</span></div>';
    }).join("");
  }

  /* ---------------- shared publish ---------------- */
  function nextState(id){
    var t = todayKey(), c = {};
    if(STATE.d === t) for(var k in STATE.c) c[k] = STATE.c[k];
    c[id] = (c[id]||0) + 1;
    return {d:t, c:c};
  }
  function pushTally(id){
    if(!window.claude || !claude.use) return;
    claude.use("artifact").then(function(art){
      if(!art) return;
      return art.publish(buildDoc(nextState(id)));
    }).catch(function(){});
  }

  function playFart(){
    try{
      var a = new Audio(FART_SND);
      a.volume = .9;
      a.play()["catch"](function(){});
    }catch(e){}
  }

  /* ---------------- draw ---------------- */
  function draw(){
    var pick = DDONG[Math.floor(Math.random()*N)];
    var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    var rec = {date: todayKey(), id: pick.id};
    var dish = $("dish"), lever = $("lever");

    function commit(){
      save(KEY, rec);
      var h = load(HKEY) || []; h.unshift(rec); save(HKEY, h.slice(0,7));
      if(!reduce) playFart();
      renderResult(pick, true); renderHistory(); renderTally(pick.id);
      if(!TEST) setTimeout(function(){ pushTally(pick.id); }, 1400);
    }
    if(reduce){ commit(); return; }

    lever.disabled = true; lever.textContent = T.opening;
    dish.innerHTML = buttSVG(true);
    dish.className = "dish shaking";
    setTimeout(function(){ dish.className = "dish opening"; }, 130);
    setTimeout(commit, 130 + 220);
  }

  /* ---------------- boot ---------------- */
  document.getElementById("root").innerHTML = shell();
  document.title = T.title;
  document.documentElement.lang = LANG;
  $("lever").addEventListener("click", draw);
  $("langBtn").addEventListener("click", function(){ setLang(LANG==="ko"?"en":"ko"); });

  var taps = 0, tapT = null;
  $("today").addEventListener("click", function(){
    taps++; clearTimeout(tapT);
    tapT = setTimeout(function(){ taps = 0; }, 900);
    if(taps >= 3){ taps = 0; toggleTest(); }
  });
  if(TEST) $("hint").innerHTML = '<span class="testchip">'+T.testChipHint+'</span>';

  var saved = load(KEY), myId = null;
  if(saved && saved.date === todayKey() && byId(saved.id)){ myId = saved.id; renderResult(byId(saved.id), false); }
  renderHistory();
  renderTally(myId);

  var built = false;
  $("ledgerBtn").addEventListener("click", function(){
    var open = $("ledgerSect").hidden;
    if(open && !built){
      $("ledger").innerHTML = DDONG.map(function(it,i){
        var f = fortuneOf(it);
        return '<article class="entry'+(i===0?" first":"")+'">'+
          '<div class="edish">'+svg(it.art)+'</div><div>'+
          '<div class="rk">'+String(i+1).padStart(2,"0")+' / '+N+' · '+T.grade+' '+it.grade+'</div>'+
          '<h4>'+esc(it.name[LANG])+'</h4>'+
          '<p class="f">'+esc(f.head)+'</p><p class="d">'+esc(it.desc[LANG])+'</p></div></article>';
      }).join("");
      built = true;
    }
    $("ledgerSect").hidden = !open;
    $("ledgerBtn").setAttribute("aria-expanded", String(open));
    $("chev").textContent = open ? "▴" : "▾";
    if(open) $("ledgerSect").scrollIntoView({behavior:"smooth", block:"start"});
  });
})();
</script>
